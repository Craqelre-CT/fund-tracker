<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基金涨幅追踪</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #4f7cff;
      --primary-dark: #3a5fd9;
      --up: #e53935;
      --down: #2e9e5b;
      --text: #1f2733;
      --muted: #8a94a6;
      --border: #e6e9f2;
      --shadow: 0 4px 18px rgba(60, 80, 140, 0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.5;
    }
    .container { max-width: 1080px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    header h1 {
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 .logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--primary), #7a9bff);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px;
    }
    header p { color: var(--muted); margin-top: 6px; font-size: 14px; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--card);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .stat .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .stat .value { font-size: 24px; font-weight: 700; }
    .stat .delta { font-size: 13px; margin-top: 6px; font-weight: 600; }
    .up { color: var(--up); }
    .down { color: var(--down); }

    .panel {
      background: var(--card);
      border-radius: 14px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .panel h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel h2::before {
      content: "";
      width: 4px; height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }

    form {
      display: grid;
      grid-template-columns: 90px 80px 80px 1fr auto;
      gap: 12px;
      align-items: end;
    }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
    }
    button {
      padding: 10px 22px;
      border: none;
      border-radius: 9px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }
    button:hover { background: var(--primary-dark); }
    button:active { transform: scale(0.97); }
    button.danger {
      background: transparent;
      color: var(--up);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-size: 12px;
    }
    button.danger:hover { background: #fef0f0; }

    .chart-wrap { height: 360px; position: relative; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    td.num, th.num { text-align: right; }
    tbody tr:hover { background: #f8faff; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }

    @media (max-width: 720px) {
      .summary { grid-template-columns: 1fr; }
      form { grid-template-columns: 1fr 1fr; }
      form .field.amount, form button { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span class="logo">📈</span> 基金涨幅追踪</h1>
      <p>记录每次净值金额，自动计算单次涨跌幅与整体涨跌幅，并绘制折线图。</p>
    </header>

    <section class="summary">
      <div class="stat">
        <div class="label">最新金额</div>
        <div class="value" id="latestValue">—</div>
        <div class="delta" id="latestDelta">暂无数据</div>
      </div>
      <div class="stat">
        <div class="label">整体涨跌幅</div>
        <div class="value" id="overallDelta">—</div>
        <div class="delta" id="overallRange">首次 → 末次</div>
      </div>
      <div class="stat">
        <div class="label">记录数</div>
        <div class="value" id="recordCount">0</div>
        <div class="delta">条记录</div>
      </div>
    </section>

    <div class="panel">
      <h2>添加记录</h2>
      <form id="addForm">
        <div class="field">
          <label>年</label>
          <input type="number" id="year" min="1900" max="2200" required>
        </div>
        <div class="field">
          <label>月</label>
          <input type="number" id="month" min="1" max="12" required>
        </div>
        <div class="field">
          <label>日</label>
          <input type="number" id="day" min="1" max="31" required>
        </div>
        <div class="field amount">
          <label>金额（元）</label>
          <input type="number" id="amount" step="0.0001" placeholder="例如 12345.67" required>
        </div>
        <button type="submit">添加</button>
      </form>
    </div>

    <div class="panel">
      <h2>金额折线图</h2>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </div>

    <div class="panel">
      <h2>记录明细</h2>
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th class="num">金额（元）</th>
            <th class="num">本次涨跌幅</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4" class="empty">还没有记录，先添加一条吧</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'fund_records_v1';
    let records = loadRecords();
    let chart = null;

    function loadRecords() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) { return []; }
    }
    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }
    function pad(n) { return String(n).padStart(2, '0'); }
    function dateKey(r) { return `${r.year}-${pad(r.month)}-${pad(r.day)}`; }
    function formatDate(r) { return `${r.year}年${r.month}月${r.day}日`; }
    function sortRecords() {
      records.sort((a, b) =>
        dateKey(a).localeCompare(dateKey(b))
      );
    }
    function pct(diff, base) {
      if (base == null || base === 0 || isNaN(base)) return null;
      return (diff / base) * 100;
    }
    function fmtPct(p) {
      if (p == null || isNaN(p)) return '—';
      const s = p.toFixed(2) + '%';
      return (p >= 0 ? '+' : '') + s;
    }
    function fmtMoney(v) {
      if (v == null || isNaN(v)) return '—';
      return Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    }

    function setDefaultDate() {
      const now = new Date();
      document.getElementById('year').value = now.getFullYear();
      document.getElementById('month').value = now.getMonth() + 1;
      document.getElementById('day').value = now.getDate();
    }

    function render() {
      sortRecords();
      renderSummary();
      renderTable();
      renderChart();
      saveRecords();
    }

    function renderSummary() {
      const latestEl = document.getElementById('latestValue');
      const latestDeltaEl = document.getElementById('latestDelta');
      const overallEl = document.getElementById('overallDelta');
      const overallRangeEl = document.getElementById('overallRange');
      const countEl = document.getElementById('recordCount');

      countEl.textContent = records.length;

      if (records.length === 0) {
        latestEl.textContent = '—';
        latestDeltaEl.textContent = '暂无数据';
        latestDeltaEl.className = 'delta';
        overallEl.textContent = '—';
        overallRangeEl.textContent = '首次 → 末次';
        overallEl.className = 'value';
        return;
      }

      const last = records[records.length - 1];
      latestEl.textContent = fmtMoney(last.amount);

      if (records.length >= 2) {
        const prev = records[records.length - 2];
        const p = pct(last.amount - prev.amount, prev.amount);
        latestDeltaEl.textContent = '较上次 ' + fmtPct(p) + '（' + (last.amount - prev.amount >= 0 ? '+' : '') + (last.amount - prev.amount).toFixed(2) + '）';
        latestDeltaEl.className = 'delta ' + (p >= 0 ? 'up' : 'down');
      } else {
        latestDeltaEl.textContent = '首次记录';
        latestDeltaEl.className = 'delta';
      }

      if (records.length >= 2) {
        const first = records[0];
        const p = pct(last.amount - first.amount, first.amount);
        overallEl.textContent = fmtPct(p);
        overallEl.className = 'value ' + (p >= 0 ? 'up' : 'down');
        overallRangeEl.textContent = formatDate(first) + ' → ' + formatDate(last);
      } else {
        overallEl.textContent = '—';
        overallEl.className = 'value';
        overallRangeEl.textContent = '仅一条记录';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      if (records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">还没有记录，先添加一条吧</td></tr>';
        return;
      }
      tbody.innerHTML = records.map((r, i) => {
        let deltaHtml = '<span class="down" style="color:var(--muted)">—</span>';
        if (i > 0) {
          const prev = records[i - 1];
          const p = pct(r.amount - prev.amount, prev.amount);
          const cls = p >= 0 ? 'up' : 'down';
          const arrow = p >= 0 ? '▲' : '▼';
          deltaHtml = `<span class="${cls}">${arrow} ${fmtPct(p)}</span>`;
        }
        return `<tr>
          <td>${formatDate(r)}</td>
          <td class="num">${fmtMoney(r.amount)}</td>
          <td class="num">${deltaHtml}</td>
          <td class="num"><button class="danger" data-idx="${i}">删除</button></td>
        </tr>`;
      }).join('');
    }

    function renderChart() {
      const ctx = document.getElementById('chart').getContext('2d');
      const labels = records.map(dateKey);
      const data = records.map(r => r.amount);

      if (chart) { chart.destroy(); }

      const gradient = ctx.createLinearGradient(0, 0, 0, 360);
      gradient.addColorStop(0, 'rgba(79,124,255,0.28)');
      gradient.addColorStop(1, 'rgba(79,124,255,0.00)');

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: '基金金额',
            data,
            borderColor: '#4f7cff',
            backgroundColor: gradient,
            borderWidth: 2.5,
            fill: true,
            tension: 0.25,
            pointRadius: 4,
            pointHoverRadius: 6,
            pointBackgroundColor: '#4f7cff',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: (items) => {
                  const idx = items[0].dataIndex;
                  return formatDate(records[idx]);
                },
                label: (item) => {
                  const idx = item.dataIndex;
                  let lines = ['金额：' + fmtMoney(item.parsed.y) + ' 元'];
                  if (idx > 0) {
                    const prev = records[idx - 1];
                    const p = pct(item.parsed.y - prev.amount, prev.amount);
                    lines.push('本次涨跌：' + fmtPct(p));
                  }
                  return lines;
                }
              }
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#8a94a6' } },
            y: {
              grid: { color: '#eef1f7' },
              ticks: { color: '#8a94a6', callback: (v) => fmtMoney(v) }
            }
          }
        }
      });
    }

    document.getElementById('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const year = parseInt(document.getElementById('year').value, 10);
      const month = parseInt(document.getElementById('month').value, 10);
      const day = parseInt(document.getElementById('day').value, 10);
      const amount = parseFloat(document.getElementById('amount').value);

      if (!year || !month || !day || isNaN(amount)) {
        alert('请填写完整的日期和金额');
        return;
      }
      if (month < 1 || month > 12 || day < 1 || day > 31) {
        alert('日期不合法');
        return;
      }
      const d = new Date(year, month - 1, day);
      if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) {
        alert('日期不合法');
        return;
      }

      records.push({ year, month, day, amount });
      document.getElementById('amount').value = '';
      setDefaultDate();
      render();
    });

    document.getElementById('tableBody').addEventListener('click', (e) => {
      if (e.target.classList.contains('danger')) {
        const idx = parseInt(e.target.dataset.idx, 10);
        if (!isNaN(idx)) {
          records.splice(idx, 1);
          render();
        }
      }
    });

    setDefaultDate();
    render();
  </script>
</body>
</html>
